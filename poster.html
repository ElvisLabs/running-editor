<style>

.num { font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; }

/* ================= edit panel ================= */
.panel {
  position: fixed; left: 0; top: 0; bottom: 0; width: 300px; z-index: 10;
  background: #16213e; color: #e0e0e0; padding: 20px; overflow-y: auto;

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: #99aabb; margin-bottom: 3px; }
.field input, .field select {
  width: 100%; padding: 7px 10px; background: #0f3460;
  border: 1px solid #2a3a5c; border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none;

.field input:focus { border-color: #4db890; }
.row2 { display: flex; gap: 10px; }

.tip { font-size: 11px; color: #667799; line-height: 1.5; margin-top: 2px; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #7fd8b6; margin: 0 0 10px; cursor: pointer; }
.chk input { width: auto; margin: 0; }

.btn {

<script src="./vendor/html2canvas-1.4.1.min.js"></script>

<script>
// x slot: bar/label centers measured from the original screenshot
const X0 = 14, STEP = 32.766, CH = 303;   // relative to #chart's left (stage x 40)

const $ = id => document.getElementById(id);

function parseRuns(str) {
  const runs = {};
  str.split(/[,，]/).forEach(part => {
    const m = part.split(/[:：]/);
    const d = parseInt(m[0], 10), v = parseFloat(m[1]);
    if (d >= 1 && d <= 31 && v > 0) runs[d] = v;
  });
  return runs;
}

function parseHMS(str) {
  const p = String(str).split(/[:：]/).map(Number);
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  return 0;
}

function fmtPace(sec, km) {
  if (!km || !sec) return "0'00\"";
  const p = sec / km;
  if (p >= 3600) return ">60'00\"";           // the app caps pace at 60 min/km
  return Math.floor(p / 60) + "'" + String(Math.round(p % 60)).padStart(2, '0') + '"';
}

function niceMax(peak) {
  if (peak <= 0) return 10;
  return peak <= 5 ? Math.ceil(peak) : Math.ceil(peak / 5) * 5;
}

function makeRng(seed) {
  let a = seed | 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function daysInMonth(dateStr) {
  const m = String(dateStr).match(/(\d{4})\D+(\d{1,2})/);
  if (!m) return 31;
  return new Date(+m[1], +m[2], 0).getDate();
}

// spread a monthly total over N random days so the parts sum back to it exactly
function genRuns(total, count, days, seed) {
  count = Math.max(1, Math.min(Math.round(count) || 1, days));
  if (!(total > 0)) return {};
  const rand = makeRng(seed);
  const pool = Array.from({ length: days }, (_, i) => i + 1);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const chosen = pool.slice(0, count).sort((a, b) => a - b);
  const w = chosen.map(() => 0.45 + rand());
  const sw = w.reduce((a, b) => a + b, 0);
  const vals = w.map(x => Math.max(0.01, Math.round(x / sw * total * 100) / 100));
  const drift = Math.round((total - vals.reduce((a, b) => a + b, 0)) * 100) / 100;
  const mi = vals.indexOf(Math.max(...vals));
  vals[mi] = Math.max(0.01, Math.round((vals[mi] + drift) * 100) / 100);
  const out = {};
  chosen.forEach((d, i) => out[d] = vals[i]);
  return out;
}

let distSeed = 20260729;

// auto: 总公里数 → 每日分布 → 最远距离/配速/满刻度
// manual: 每日分布 → 总公里数/次数/最远距离/配速/满刻度
function syncDerived() {
  const auto = $('in-auto').checked;
  $('in-runs').readOnly = auto;
  $('in-runs').classList.toggle('auto', auto);
  ['in-km', 'in-count'].forEach(id => {
    $(id).readOnly = !auto;
    $(id).classList.toggle('auto', !auto);
  });
  ['in-dist', 'in-pace', 'in-max'].forEach(id => {
    $(id).readOnly = true;
    $(id).classList.add('auto');
  });

  let vals;
  if (auto) {
    const total = parseFloat($('in-km').value) || 0;
    const runs = genRuns(total, parseFloat($('in-count').value), daysInMonth($('in-date').value), distSeed);
    $('in-runs').value = Object.entries(runs).map(([d, v]) => d + ':' + v.toFixed(2)).join(', ');
    vals = Object.values(runs);
  } else {
    vals = Object.values(parseRuns($('in-runs').value));
    const sum = vals.reduce((a, b) => a + b, 0);
    $('in-km').value = sum.toFixed(2);
    $('in-count').value = vals.length;
  }

  const sum = vals.reduce((a, b) => a + b, 0);
  const peak = vals.length ? Math.max(...vals) : 0;
  $('in-dist').value = peak.toFixed(2);
  $('in-pace').value = fmtPace(parseHMS($('in-time').value), sum);
  $('in-max').value  = niceMax(peak);
}

function renderChart() {
  const chart = $('chart');
  chart.querySelectorAll('.bar').forEach(el => el.remove());
  const runs = parseRuns($('in-runs').value);
  const max = parseFloat($('in-max').value) || 10;
  for (const [day, km] of Object.entries(runs)) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const h = Math.min(km / max, 1) * CH;
    bar.style.left = (X0 + (day - 1) * STEP) + 'px';
    bar.style.width = '13px';
    bar.style.height = h + 'px';
    // mint fading downward into the background, flat top (like the original)
    bar.style.background =
      'linear-gradient(180deg, #b7f2e6 0%, #9de6d5 6%, #8cc9bd 20%, #73a59c 40%, #5b7f78 60%, #33494a 82%, rgba(30,45,50,0) 100%)';
    chart.appendChild(bar);
  }
}

function renderAll() {
  syncDerived();
  $('o-name').textContent = $('in-name').value;
  $('o-date').textContent = $('in-date').value;
  $('o-km').textContent   = $('in-km').value;
  $('o-time').textContent = $('in-time').value;
  $('o-count').textContent = $('in-count').value;
  $('o-dist').textContent = $('in-dist').value;
  $('o-pace').textContent = $('in-pace').value;
  $('o-pct').textContent  = $('in-pct').value;
  $('o-city').textContent = $('in-city').value;
  renderChart();
}

function applyScale() {
  const s = parseFloat($('in-scale').value);
  const stage = document.querySelector('.stage');
  stage.style.transform = 'scale(' + s + ')';
  $('scalebox').style.width  = (1093 * s) + 'px';
  $('scalebox').style.height = (2000 * s) + 'px';
}

document.querySelectorAll('.panel input').forEach(el => {
  el.addEventListener('input', renderAll);
  el.addEventListener('change', renderAll);
});
$('in-scale').addEventListener('change', applyScale);
$('btn-regen').addEventListener('click', () => {
  distSeed = (distSeed * 1103515245 + 12345) & 0x7fffffff;
  $('in-auto').checked = true;
  renderAll();
});
$('btn-export').addEventListener('click', async () => {
  const button = $('btn-export');
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = '正在导出…';
  try {
    renderAll();
    const date = $('in-date').value.trim().replace(/\D+/g, '_').replace(/^_|_$/g, '');
    await exportStagePNG(
      document.querySelector('.stage'),
      `running_poster_${date || 'export'}.png`,
      { width: 1279, height: 2340 }
    );
  } catch (error) {
    console.error(error);
    alert('导出失败：' + error.message);
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
});

// x-axis labels (fixed 1..31)
(function () {
  const xl = $('xlabels');
  [1, 6, 11, 16, 21, 26, 31].forEach(d => {
    const s = document.createElement('span');
    s.style.left = (X0 + (d - 1) * STEP) + 'px';
    s.textContent = d;
    xl.appendChild(s);
  });
})();

// deterministic pseudo-QR: black modules on the white box
(function () {
  const cv = $('qr'), ctx = cv.getContext('2d');
  const N = 29, S = cv.width / N;
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rand = rng(20260729);
  ctx.fillStyle = '#111';
  const cell = (x, y) => ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.ceil(S), Math.ceil(S));
  function finder(ox, oy) {
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
      const ring = x === 0 || x === 6 || y === 0 || y === 6;
      const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      if (ring || core) cell(ox + x, oy + y);
    }
  }
  const inFinder = (x, y) => (x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (!inFinder(x, y) && rand() < 0.46) cell(x, y);
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  const a = N - 9;
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
    const ring = x === 0 || x === 4 || y === 0 || y === 4;
    if (ring || (x === 2 && y === 2)) cell(a + x, a + y);
  }
})();

renderAll();
applyScale();
</script>
