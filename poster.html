<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的跑步生涯月数据 · 原图数字编辑</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; background: #1c1c1e; }
body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
    "Helvetica Neue", Arial, sans-serif;
}

.panel {
  position: fixed; inset: 0 auto 0 0; width: 320px; z-index: 10;
  padding: 22px; overflow-y: auto; color: #e7edf2; background: #16213e;
  box-shadow: 8px 0 24px rgba(0, 0, 0, .22);
}
.panel h1 {
  margin-bottom: 10px; padding-bottom: 11px;
  border-bottom: 1px solid #2a3a5c; color: #74e6bd; font-size: 18px;
}
.panel h2 {
  margin: 18px 0 8px; color: #8fa1c3; font-size: 12px;
  letter-spacing: 1px;
}
.intro, .tip {
  color: #8998b5; font-size: 12px; line-height: 1.6;
}
.field { margin-bottom: 11px; }
.field label {
  display: block; margin-bottom: 4px; color: #aab7ce; font-size: 12px;
}
.field input, .field select {
  width: 100%; padding: 9px 10px; border: 1px solid #304469;
  border-radius: 7px; outline: none; color: #f3f7fa; background: #0f3460;
  font-size: 14px;
}
.field input:focus, .field select:focus { border-color: #52c9a2; }
.row { display: flex; gap: 10px; }
.row .field { flex: 1; min-width: 0; }
.btn {
  width: 100%; padding: 10px; border: 0; border-radius: 7px;
  cursor: pointer; color: #f1fbf7; background: #168267;
  font-size: 14px; font-weight: 600;
}
.btn:hover { background: #1a9a79; }
.btn.secondary {
  margin-top: 9px; color: #c8d4e6; background: #2a3a5c; font-weight: 500;
}
.btn.secondary:hover { background: #35496e; }
.btn:disabled { opacity: .65; cursor: wait; }
.proof {
  margin-top: 16px; padding: 10px 11px; border: 1px solid #29445a;
  border-radius: 7px; color: #82d8bb; background: #102b3a;
  font-size: 11px; line-height: 1.55;
}

.viewport {
  min-height: 100vh; margin-left: 320px; padding: 24px;
  display: flex; justify-content: center; align-items: flex-start;
}
#scalebox { flex: 0 0 auto; }
#poster {
  display: block; width: 1279px; height: 2340px;
  box-shadow: 0 12px 48px rgba(0, 0, 0, .42);
  background: #142027;
}

@media (max-width: 760px) {
  .panel { position: static; width: 100%; }
  .viewport { margin-left: 0; padding: 12px; overflow: auto; justify-content: flex-start; }
}
</style>
</head>
<body>
<aside class="panel">
  <h1>海报数字编辑</h1>
  <p class="intro">使用你提供的原始截图作为底图，只覆盖下列数值、百分比和地区。人物、柱状图、其他文字、Logo、二维码及其他像素保持原样。</p>

  <h2>预览</h2>
  <div class="field">
    <label for="in-scale">预览缩放</label>
    <select id="in-scale">
      <option value="0.3">30%</option>
      <option value="0.4" selected>40%（默认）</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%（原图尺寸）</option>
    </select>
  </div>

  <h2>只修改数字</h2>
  <div class="field">
    <label for="in-km">总公里数</label>
    <input id="in-km" value="46.75" inputmode="decimal">
  </div>
  <div class="field">
    <label for="in-time">总用时</label>
    <input id="in-time" value="08:34:15" inputmode="numeric">
  </div>
  <div class="row">
    <div class="field">
      <label for="in-count">总次数</label>
      <input id="in-count" value="11" inputmode="numeric">
    </div>
    <div class="field">
      <label for="in-dist">最远距离</label>
      <input id="in-dist" value="7.89" inputmode="decimal">
    </div>
  </div>
  <div class="field">
    <label for="in-pace">平均配速</label>
    <input id="in-pace" value="11'00&quot;">
  </div>
  <div class="row">
    <div class="field">
      <label for="in-pct">超过百分比 %</label>
      <input id="in-pct" value="25.3" inputmode="decimal">
    </div>
    <div class="field">
      <label for="in-city">地区</label>
      <input id="in-city" value="盐城市">
    </div>
  </div>

  <button class="btn" id="btn-export">导出原尺寸 PNG</button>
  <button class="btn secondary" id="btn-reset">恢复原截图数字</button>
  <p class="tip" style="margin-top:10px">导出固定为 1279 × 2340，不受预览缩放影响。</p>
  <div class="proof">像素保护：七个可编辑区域之外与原截图逐像素一致；图表不会随次数或里程重新生成。</div>
</aside>

<main class="viewport">
  <div id="scalebox">
    <canvas id="poster" width="1279" height="2340" aria-label="跑步月数据海报预览"></canvas>
  </div>
</main>

<script>
const WIDTH = 1279;
const HEIGHT = 2340;
const $ = id => document.getElementById(id);
const canvas = $('poster');
const ctx = canvas.getContext('2d');
const template = new Image();
const originalPoster = new Image();
let assetsLoaded = 0;
let assetsReady = false;

const originalValues = {
  km: '11.57',
  time: '21:30:46',
  count: '2',
  dist: '7.89',
  pace: ">60'00\"",
  pct: '25.3',
  city: '盐城市'
};

function assetLoaded() {
  assetsLoaded += 1;
  if (assetsLoaded === 2) {
    assetsReady = true;
    renderPoster();
  }
}

template.onload = assetLoaded;
originalPoster.onload = assetLoaded;
template.onerror = originalPoster.onerror =
  () => alert('原图素材加载失败，请刷新页面重试。');
template.src = './assets/poster-number-template.png';
originalPoster.src = './assets/poster-original.png';

function setTextFont(size, weight = 700, color = '#fbfdfd') {
  ctx.font = `${weight} ${size}px -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
}

function fitAndDraw(
  text, x, baseline, maxWidth, initialSize,
  align = 'left', weight = 700, color = '#fbfdfd'
) {
  const value = String(text).trim();
  let size = initialSize;
  setTextFont(size, weight, color);
  while (size > 34 && ctx.measureText(value).width > maxWidth) {
    size -= 1;
    setTextFont(size, weight, color);
  }
  ctx.textAlign = align;
  ctx.fillText(value, x, baseline);
}

function drawChangedValue(key, area, drawValue) {
  const value = $(`in-${key}`).value.trim();
  if (value === originalValues[key]) return;
  const [x, y, width, height] = area;
  ctx.drawImage(template, x, y, width, height, x, y, width, height);
  drawValue(value);
}

function renderPoster() {
  if (!assetsReady) return;
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  ctx.drawImage(originalPoster, 0, 0, WIDTH, HEIGHT);

  drawChangedValue('km', [466, 365, 352, 115],
    value => fitAndDraw(value, 640, 469, 360, 116, 'center', 600));
  drawChangedValue('time', [54, 1352, 378, 88],
    value => fitAndDraw(value, 63, 1425, 370, 76));
  drawChangedValue('count', [697, 1352, 75, 88],
    value => fitAndDraw(value, 704, 1425, 72, 76));
  drawChangedValue('dist', [54, 1642, 196, 88],
    value => fitAndDraw(value, 63, 1714, 185, 76));
  drawChangedValue('pace', [697, 1642, 341, 88],
    value => fitAndDraw(value, 704, 1714, 325, 76));
  drawChangedValue('pct', [710, 1848, 150, 80],
    value => fitAndDraw(`${value.replace(/%$/, '')}%`, 720, 1912, 138, 50, 'left', 400, '#e9edef'));
  drawChangedValue('city', [858, 1848, 250, 80],
    value => fitAndDraw(value, 864, 1912, 235, 50, 'left', 400, '#e9edef'));
}

function applyScale() {
  const scale = Number($('in-scale').value) || .4;
  canvas.style.width = `${WIDTH * scale}px`;
  canvas.style.height = `${HEIGHT * scale}px`;
  $('scalebox').style.width = `${WIDTH * scale}px`;
  $('scalebox').style.height = `${HEIGHT * scale}px`;
}

function exportPNG() {
  const button = $('btn-export');
  button.disabled = true;
  button.textContent = '正在导出…';
  renderPoster();
  canvas.toBlob(blob => {
    try {
      if (!blob) throw new Error('无法生成 PNG');
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `running_poster_${$('in-km').value || 'export'}km.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (error) {
      alert('导出失败：' + error.message);
    } finally {
      button.disabled = false;
      button.textContent = '导出原尺寸 PNG';
    }
  }, 'image/png');
}

document.querySelectorAll('.panel input').forEach(input => {
  input.addEventListener('input', renderPoster);
});
$('in-scale').addEventListener('change', applyScale);
$('btn-export').addEventListener('click', exportPNG);
$('btn-reset').addEventListener('click', () => {
  Object.entries(originalValues).forEach(([key, value]) => {
    $(`in-${key}`).value = value;
  });
  renderPoster();
});

applyScale();
</script>
</body>
</html>
